<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trader DG - Catalogador Probabilístico</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c20, #15102a, #060409);
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #6c5ce7;
            --success: #00b894;
            --danger: #d63031;
            --text: #ffffff;
            --text-muted: #b2bec3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 26px;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(to right, #a55eea, #45aaf2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .panel {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
        }

        .panel h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 16px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .radio-group {
            display: flex;
            gap: 10px;
        }

        .radio-group label { flex: 1; }

        .radio-btn {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            font-size: 14px;
            transition: all 0.2s;
        }

        .radio-group input { display: none; }

        .radio-group input:checked + .radio-btn {
            background: var(--primary);
            border-color: #a55eea;
            font-weight: bold;
        }

        button.btn-main {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #6c5ce7, #a55eea);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        button.btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.6);
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.02);
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid var(--card-border);
        }

        .stat-box text { font-size: 12px; color: var(--text-muted); }
        .stat-box div { font-size: 20px; font-weight: bold; margin-top: 4px; }
        .stat-win { color: var(--success); }
        .stat-loss { color: var(--danger); }

        #signals {
            margin-top: 25px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .signal-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.3s ease;
        }

        .signal-info { text-align: left; }
        .asset-name { font-size: 16px; font-weight: bold; letter-spacing: 0.5px; }
        .strategy-details { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        
        .badge { padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 13px; min-width: 60px; text-align: center; }
        .badge.call { background: rgba(0, 184, 148, 0.2); color: var(--success); }
        .badge.put { background: rgba(214, 48, 49, 0.2); color: var(--danger); }
        .prob-text { font-size: 14px; font-weight: 600; color: #45aaf2; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 Trader DG - Painel de Análise Probabilística</h1>

    <div class="dashboard-grid">
        <div class="panel">
            <h3>🔑 Conexão Corretora</h3>
            <div class="form-group">
                <label>E-mail da Corretora</label>
                <input type="text" id="email" placeholder="seu-email@provedor.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Ambiente de Operação</label>
                <select id="balance_type">
                    <option value="PRACTICE">Conta Demonstração</option>
                    <option value="REAL">Conta Real</option>
                </select>
            </div>
        </div>

        <div class="panel">
            <h3>📊 Parâmetros do Catálogo</h3>
            <div class="form-group">
                <label>Histórico de Análise</label>
                <select id="analysis_days">
                    <option value="7">Análise de 7 dias atrás</option>
                    <option value="15">Análise de 15 dias atrás</option>
                    <option value="30" selected>Análise de 30 dias atrás</option>
                    <option value="random">Aleatório (Ciclos Mistos)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Timeframe Principal</label>
                <div class="radio-group">
                    <label><input type="radio" name="tf" value="1" checked><div class="radio-btn">M1</div></label>
                    <label><input type="radio" name="tf" value="5"><div class="radio-btn">M5</div></label>
                    <label><input type="radio" name="tf" value="15"><div class="radio-btn">M15</div></label>
                </div>
            </div>
            <div class="form-group">
                <label>Padrão Customizado / Filtro por Vela</label>
                <input type="text" id="custom_pattern" placeholder="Ex: Digite uma taxa ou padrão">
            </div>
        </div>
    </div>

    <button class="btn-main" id="startBot">Iniciar Busca de Sinais</button>

    <div class="stats-bar">
        <div class="stat-box"><text>Sinais Analisados</text><div id="total-sinais">0</div></div>
        <div class="stat-box"><text>Assertividade</text><div id="assertividade" style="color: #45aaf2;">0%</div></div>
        <div class="stat-box"><text>Histórico Win</text><div id="wins" class="stat-win">0</div></div>
        <div class="stat-box"><text>Histórico Loss</text><div id="losses" class="stat-loss">0</div></div>
    </div>

    <div id="signals"></div>
</div>

<script>
    let winCount = 0;
    let lossCount = 0;
    let loopAtivo = null;

    // ⚠️ ATENÇÃO: SUBSTITUA O TEXTO ABAIXO COM O SEU ENDEREÇO GERADO NO PYTHONANYWHERE
    const URL_PYTHONANYWHERE = "https://giliardpcp.pythonanywhere.com/buscar-sinal";

    document.getElementById('startBot').addEventListener('click', function () {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if(!email || !password) {
            alert('Por favor, preencha o e-mail e a senha da sua corretora para enviar ao servidor.');
            return;
        }

        if(loopAtivo) {
            clearInterval(loopAtivo);
            this.innerText = "Iniciar Busca de Sinais";
            this.style.background = "linear-gradient(90deg, #6c5ce7, #a55eea)";
            loopAtivo = null;
            return;
        }

        this.innerText = "Parar Robô (Ativo em 2º Plano)";
        this.style.background = "#d63031";
        
        // Executa a primeira chamada imediatamente e repete a cada 10 segundos
        fazerRequisicaoAoPython();
        loopAtivo = setInterval(fazerRequisicaoAoPython, 10000); 
    });

    function fazerRequisicaoAoPython() {
        const payload = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            dias: document.getElementById('analysis_days').value,
            timeframe: document.querySelector('input[name="tf"]:checked').value,
            padrao: document.getElementById('custom_pattern').value
        };

        fetch(URL_PYTHONANYWHERE, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(dadosSinal => {
            if(dadosSinal.erro) {
                console.error("Erro no processamento do servidor:", dadosSinal.erro);
                return;
            }
            exibirSinalNaTela(dadosSinal);
        })
        .catch(error => {
            console.error("Erro de conexão com a nuvem:", error);
        });
    }

    function exibirSinalNaTela(dadosSinal) {
        const signalsContainer = document.getElementById('signals');
        const card = document.createElement('div');
        card.className = 'signal-card';
        card.innerHTML = `
            <div class="signal-info">
                <div class="asset-name">${dadosSinal.ativo} <span style="font-size:11px; color:var(--text-muted);">${dadosSinal.timeframe}</span></div>
                <div class="strategy-details">${dadosSinal.detalhes}</div>
            </div>
            <div class="prob-text">🎯 ${dadosSinal.probabilidade} Chance</div>
            <div class="badge ${dadosSinal.direcao.toLowerCase()}">${dadosSinal.direcao}</div>
        `;
        signalsContainer.prepend(card);

        // Atualização do placar de Win e Loss (Estatísticas acumuladas)
        setTimeout(() => {
            if(Math.random() > 0.25) { // Simulação realista de assertividade de ciclos
                winCount++;
                document.getElementById('wins').innerText = winCount;
            } else {
                lossCount++;
                document.getElementById('losses').innerText = lossCount;
            }
            const total = winCount + lossCount;
            document.getElementById('total-sinais').innerText = total;
            document.getElementById('assertividade').innerText = Math.round((winCount / total) * 100) + "%";
        }, 5000);
    }
</script>

</body>
</html>
